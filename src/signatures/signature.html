<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Mail-Signatur · %%NAME%% · %%ORGANIZATION%%</title>
</head>
<body style="margin:0;padding:0;">
  <!-- Erzeugt aus src/signatures/signature.html; nicht von Hand bearbeiten.
       Thunderbird: diese Datei als HTML-Signatur auswählen.
       moz-txt-Linkklassen vermeiden doppelte URLs im Reintext.
       Das QR-Bild ist vollständig eingebettet; keine lokalen Bildpfade nötig.
  -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="520" style="width:100%;max-width:520px;border-collapse:collapse;background-color:%%COLOR:paper%%;color:%%COLOR:body%%;font-family:Arial,Helvetica,sans-serif;">
    <tr>
      <td style="padding:18px 14px 18px 16px;vertical-align:top;background-color:%%COLOR:paper%%;">
        <p style="margin:0 0 10px;font-size:10px;line-height:14px;color:%%COLOR:body%%;">
          <span style="font-family:Georgia,'Times New Roman',serif;font-size:20px;line-height:24px;font-weight:bold;color:%%COLOR:ink%%;">%%NAME%%</span>%%ROLE_LINE%%
        </p>
        <p style="margin:0 0 10px;font-size:13px;line-height:18px;color:%%COLOR:muted%%;">
          <span style="font-size:14px;line-height:24px;font-weight:bold;color:%%COLOR:accent%%;">%%ORGANIZATION%%</span><br>
          %%ADDRESS%%
        </p>
        <p style="margin:0;font-size:13px;line-height:22px;">
          E-Mail: <a class="moz-txt-link-abbreviated" href="mailto:%%EMAIL%%" style="color:%%COLOR:link-ink%%;text-decoration:none;overflow-wrap:anywhere;">%%EMAIL%%</a><br>
          Telefon: <a class="moz-txt-link-abbreviated" href="tel:%%PHONE_URI%%" style="color:%%COLOR:link-ink%%;text-decoration:none;">%%PHONE%%</a><br>
          <a class="moz-txt-link-freetext" href="%%BASE_URL%%" style="color:%%COLOR:link-ink%%;text-decoration:none;">%%BASE_URL%%</a>
        </p>
      </td>
      <td width="%%QR_COLUMN%%" style="width:%%QR_COLUMN%%px;padding:18px 0;vertical-align:top;background-color:%%COLOR:paper%%;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;">
          <tr>
            <td align="center" style="padding:0 16px;border-left:2px solid %%COLOR:carrier%%;text-align:center;">
              <img src="%%QR_URI%%" width="%%QR_SIZE%%" height="%%QR_SIZE%%" alt="" style="display:block;width:%%QR_SIZE%%px;height:%%QR_SIZE%%px;border:0;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;">
                <tr>
                  <td align="center" style="padding:8px 0 0;font-size:11px;line-height:16px;text-align:center;">
                    <p style="margin:0;"><a href="%%VCARD_URL%%" style="color:%%COLOR:link-ink%%;text-decoration:none;">Kontakt speichern (vCard)</a></p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <!-- @office-only -->
    <tr>
      <td colspan="2" style="padding:12px 16px;border-top:1px solid %%COLOR:line%%;background-color:%%COLOR:surface%%;font-size:11px;line-height:16px;color:%%COLOR:muted%%;">
        <p style="margin:0;">
        Büro für rechtliche Betreuung<br>
        Impressum: <a class="moz-txt-link-freetext" href="%%BASE_URL%%impressum.html" style="color:%%COLOR:link-ink%%;text-decoration:none;">%%BASE_URL%%impressum.html</a><br>
        Datenschutz: <a class="moz-txt-link-freetext" href="%%BASE_URL%%datenschutz.html" style="color:%%COLOR:link-ink%%;text-decoration:none;">%%BASE_URL%%datenschutz.html</a></p>
      </td>
    </tr>
    <!-- /@office-only -->
  </table>
</body>
</html>
