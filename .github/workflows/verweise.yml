# Prüft die Verweise nach außen, monatlich und auf Zuruf. Die Logik steht in
# tools/verweise-pruefen.sh und läuft genauso lokal. Ein toter Verweis macht
# den Lauf rot; GitHub meldet das per E-Mail. Was dann zu tun ist:
# docs/pflege.md, „Verweise nach außen".
name: Verweise nach außen

on:
  schedule:
    - cron: "0 6 1 * *"   # am Ersten jedes Monats, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verweise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Website erzeugen
        run: tools/build.sh
      - name: Verweise abrufen
        run: tools/verweise-pruefen.sh
