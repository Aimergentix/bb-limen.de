# Ein gemeinsamer Prüfweg für Branches, Pull Requests und Veröffentlichung.
name: Prüfung

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pruefung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, Regressionen und Satzlängen
        run: tools/pruefen.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: HTML-Validator einrichten
        run: pip install --quiet html5validator
      - name: Fertige Seiten validieren
        run: |
          tools/build.sh
          html5validator --config tools/html5validator.yml
          tools/build.sh --check
