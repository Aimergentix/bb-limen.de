# Ein gemeinsamer Prüfweg für Branches, Pull Requests und Veröffentlichung.
name: Prüfung

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pruefung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Dieselbe Python-Version, die das README als Mindeststand nennt.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build, Regressionen und Satzlängen
        run: tools/pruefen.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Feste Version: Der Prüfstand darf sich nicht ohne Commit ändern.
      # Wann gewechselt wird, steht in docs/entscheidungen.md.
      - name: HTML-Validator einrichten
        run: pip install --quiet html5validator==0.4.2
      - name: Fertige Seiten validieren
        run: |
          tools/build.sh
          html5validator --config tools/html5validator.yml
          tools/build.sh --check
