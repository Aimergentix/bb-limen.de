# Übergangsschutz für die alte Veröffentlichung aus main / (root).
# Der neue Workflow veröffentlicht ausschließlich dist/ und verwendet Jekyll nicht.
# Vor einem Push der Migration Pages auf GitHub Actions umstellen (README §4).
# Diese Datei darf erst nach bestätigter Umstellung entfernt werden.
exclude:
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - LICENSE
  - .gitattributes
  - src/
  - public/
  - dist/
  - docs/
  - reports/
  - tmp/
  - tests/
  - tools/
plugins: []
